[project]
name = "opcua-widgets"
version = "0.7.0"
description = "OPC-UA Widgets"
authors = [{ name = "Olivier R-D et al." }]
license = { text = "GNU General Public License" }
requires-python = ">=3.14"
dependencies = [
    "asyncua>=1.2b2",
    "PyQt6",
]

[project.urls]
Repository = "https://github.com/FreeOpcUa/opcua-widgets"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["uawidgets"]

[tool.setuptools.package-data]
uawidgets = ["py.typed"]

[dependency-groups]
dev = ["mypy"]

[tool.uv.sources]
asyncua = { path = "../../opcua-asyncio", editable = true }

[tool.mypy]
python_version = "3.14"
strict = true
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
exclude = "(^|/)(resources)\\.py$"

[[tool.mypy.overrides]]
module = ["asyncua.*"]
ignore_missing_imports = true
follow_imports = "skip"
