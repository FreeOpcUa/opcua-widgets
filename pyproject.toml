[project]
name = "opcua-widgets"
version = "0.6.1"
description = "OPC-UA Widgets"
authors = [{ name = "Olivier R-D et al." }]
license = { text = "GNU General Public License" }
requires-python = ">=3.9"
dependencies = [
    "asyncua",
]

[project.urls]
Repository = "https://github.com/FreeOpcUa/opcua-widgets"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["uawidgets"]
