[project]
name = "opcua-widgets"
version = "0.7.0"
description = "OPC-UA Widgets"
authors = [{ name = "Olivier R-D et al." }]
license = { text = "GNU General Public License" }
requires-python = ">=3.14"
dependencies = [
    "asyncua>=1.2b2",
    "PyQt6",
]

[project.urls]
Repository = "https://github.com/FreeOpcUa/opcua-widgets"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["uawidgets"]

[tool.uv.sources]
asyncua = { path = "../../opcua-asyncio", editable = true }
